<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0d131c"/><defs><marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#79cde8"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#a2e6b7"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ff9a9a"/></marker></defs><text x="80" y="70" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">BYTEMONK  /  ENGINEERING LAB</text><text x="1740" y="70" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">01 / 05</text><text x="80" y="155" fill="#edf3fa" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600">Start with an API that already works</text><text x="80" y="211" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">The model proposes a tool call. The application executes it.</text><rect x="80" y="365" width="365" height="235" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="108" y="413" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Support person</text><text x="108" y="459" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">“Why was this</text><text x="108" y="496" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">customer charged?”</text><path d="M465,480 L535,480" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><rect x="555" y="365" width="365" height="235" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="583" y="413" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Assistant app</text><text x="583" y="459" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Proposes get_trip</text><text x="583" y="496" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">with a trip ID</text><path d="M940,480 L1010,480" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><rect x="1030" y="365" width="365" height="235" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="1058" y="413" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Trip API</text><text x="1058" y="459" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Reads the record</text><text x="1058" y="496" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Returns trip details</text><path d="M1415,480 L1485,480" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><rect x="1505" y="365" width="335" height="235" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="1533" y="413" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Result</text><text x="1533" y="459" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Trip cancelled</text><text x="1533" y="496" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">$24.00 charged</text><rect x="290" y="735" width="1340" height="125" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="330" y="785" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600">MCP provides a common tool interface.</text><text x="330" y="833" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">The existing service still performs the operation.</text><text x="80" y="1020" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">LOCAL TEACHING EXAMPLE • FICTIONAL DATA • SIMPLIFIED ARCHITECTURE</text><text x="1620" y="1020" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">ByteMonk</text></svg>