<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0d131c"/><defs><marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#79cde8"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#a2e6b7"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ff9a9a"/></marker></defs><text x="80" y="70" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">BYTEMONK  /  ENGINEERING LAB</text><text x="1740" y="70" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">05 / 05</text><text x="80" y="155" fill="#edf3fa" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600">Three separate decisions</text><text x="80" y="211" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">A valid request is not enough to authorize execution.</text><rect x="80" y="360" width="530" height="275" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="108" y="408" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">01  Discoverable</text><text x="108" y="454" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Can the caller find</text><text x="108" y="491" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">this tool?</text><path d="M635,495 L665,495" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><rect x="695" y="360" width="530" height="275" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="723" y="408" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">02  Enabled</text><text x="723" y="454" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Has the service owner</text><text x="723" y="491" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">made it available?</text><path d="M1250,495 L1280,495" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><rect x="1310" y="360" width="530" height="275" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="1338" y="408" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">03  Authorized</text><text x="1338" y="454" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">May this caller perform</text><text x="1338" y="491" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">this operation?</text><rect x="250" y="760" width="1420" height="125" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="290" y="811" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Then the backend validates the business rules.</text><text x="290" y="858" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Eligibility, amount, and duplicate refunds still need checks.</text><text x="80" y="1020" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">LOCAL TEACHING EXAMPLE • FICTIONAL DATA • SIMPLIFIED ARCHITECTURE</text><text x="1620" y="1020" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">ByteMonk</text></svg>