<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0d131c"/><defs><marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#79cde8"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#a2e6b7"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ff9a9a"/></marker></defs><text x="80" y="70" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">BYTEMONK  /  ENGINEERING LAB</text><text x="1740" y="70" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">04 / 05</text><text x="80" y="155" fill="#edf3fa" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600">Fetch detail when it is needed</text><text x="80" y="211" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">Discovery trades smaller initial context for extra steps and messages.</text><text x="80" y="310" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">LOAD EVERYTHING</text><rect x="80" y="345" width="1760" height="145" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="108" y="393" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">All three tool definitions</text><text x="108" y="439" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">get_trip   +   get_payment   +   issue_refund</text><text x="80" y="580" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">INCREMENTAL DISCOVERY</text><rect x="80" y="620" width="540" height="165" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="108" y="668" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Discover tools</text><text x="108" y="714" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Find get_trip</text><rect x="690" y="620" width="540" height="165" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="718" y="668" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Fetch one schema</text><text x="718" y="714" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Learn required inputs</text><rect x="1300" y="620" width="540" height="165" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="1328" y="668" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Invoke tool</text><text x="1328" y="714" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Gateway checks access</text><path d="M635,700 L665,700" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><path d="M1245,700 L1275,700" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><text x="80" y="875" fill="#edf3fa" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Measure the definitions and messages, including repeated context.</text><text x="80" y="930" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Use UTF-8 bytes for this fixture. Do not label them tokens or cost savings.</text><text x="80" y="1020" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">LOCAL TEACHING EXAMPLE • FICTIONAL DATA • SIMPLIFIED ARCHITECTURE</text><text x="1620" y="1020" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">ByteMonk</text></svg>