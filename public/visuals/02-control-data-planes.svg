<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0d131c"/><defs><marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#79cde8"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#a2e6b7"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ff9a9a"/></marker></defs><text x="80" y="70" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">BYTEMONK  /  ENGINEERING LAB</text><text x="1740" y="70" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">02 / 05</text><text x="80" y="155" fill="#edf3fa" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600">Configuration and execution are separate</text><text x="80" y="211" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">A registry manages definitions. A gateway handles individual calls.</text><rect x="80" y="275" width="1760" height="270" rx="18" fill="#121f2b" stroke="#3b5067" stroke-width="2"/><text x="110" y="320" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">CONTROL PLANE  /  DEFINITIONS AND AVAILABILITY</text><rect x="115" y="350" width="470" height="155" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="143" y="398" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Discovered API</text><text x="143" y="444" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Registered as disabled</text><path d="M610,426 L675,426" fill="none" stroke="#a2e6b7" stroke-width="4" marker-end="url(#green)"/><rect x="700" y="350" width="470" height="155" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="728" y="398" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Service owner</text><text x="728" y="444" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Reviews and enables</text><path d="M1195,426 L1260,426" fill="none" stroke="#a2e6b7" stroke-width="4" marker-end="url(#green)"/><rect x="1285" y="350" width="510" height="155" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="1313" y="398" fill="#a2e6b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">MCP Registry</text><text x="1313" y="444" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Schemas · owners · enabled state</text><rect x="80" y="650" width="1760" height="290" rx="18" fill="#121c29" stroke="#3b5067" stroke-width="2"/><text x="110" y="697" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">DATA PLANE  /  RUNTIME REQUESTS</text><rect x="115" y="735" width="470" height="155" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="143" y="783" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Assistant application</text><text x="143" y="829" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Verified caller identity</text><path d="M610,810 L675,810" fill="none" stroke="#79cde8" stroke-width="4" marker-end="url(#cyan)"/><rect x="700" y="735" width="470" height="155" rx="18" fill="#172231" stroke="#3b5067" stroke-width="2"/><text x="728" y="783" fill="#79cde8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Proxy gateway</text><text x="728" y="829" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Check access · route call</text><path d="M1195,810 L1260,810" fill="none" stroke="#79cde8" stroke-w